name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  webapp-tests:
    name: WebApp (.NET) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run tests
        run: dotnet test tests/WebApp/WebApp.Tests.csproj

  oem-node-tests:
    name: OEM (Node.js) tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Oem_Node
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Oem_Node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
